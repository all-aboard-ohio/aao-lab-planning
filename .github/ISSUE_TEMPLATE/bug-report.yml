name: Bug Report
description: Report a bug or unexpected behavior in any AAO Data Lab project
title: "fix: [Short description]"
labels: ["bug"]
body:
  - type: input
    id: repo
    attributes:
      label: Which repository?
      placeholder: e.g. aao-lab-homepage, aao-lab-components
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: "1. Go to...\n2. Click on...\n3. See error"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "Browser: Chrome 123\nOS: Windows 11\nDevice: Desktop / Mobile"

  - type: textarea
    id: notes
    attributes:
      label: Additional Context
      description: Screenshots, error messages, console output, anything else relevant.
